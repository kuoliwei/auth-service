schema: spec-driven

# Project context
# 顯示給 AI 在建立/修改 openspec 文件時參考。本檔描述的是 auth-service「當前實際」的架構，
# 不是理想版——刻意記錄遺留代碼與隱藏耦合，因為它們正是後續「規格驅動優化」的對象。
context: |
  ## auth-service（Persona Nexus 平台的認證服務）

  類 Character.ai 的 AI 角色扮演平台其中一個微服務。本服務只負責**註冊**與**登入**、簽發 JWT。
  學習性質專案，協作偏好「教學引導、讓使用者自己動手」——解釋原理、給方向，不直接貼完整程式碼。

  ### 技術棧
  Node.js 20+ ／ Express 5 ／ ESM modules ／ bcrypt（密碼雜湊）／ jsonwebtoken（JWT）
  ／ zod（輸入驗證）／ Jest + Babel（測試）。**本服務沒有自己的資料庫**。

  ### 當前架構（三層 + 一個 middleware）
  ```
  瀏覽器 → api-gateway(8000) → auth-service(3000)
                                   │
        app.js（路由 + CORS + validateMiddleware，僅掛 register）
                                   ↓
        controllers/authController.js（HTTP 進出、ERROR_MAP 查表→HTTP status）
                                   ↓
        services/authService.js（業務邏輯：查重、bcrypt、簽 JWT）
                                   ↓
        repositories/userRepository.js（HTTP fetch → api-gateway /internal/users）
                                   ↓
                    api-gateway(8000) /internal/users → user-service(4000)  ← 真正存使用者的地方
  ```
  輔助模組：`schemas/authSchema.js`（zod registerSchema）、`utils/jwtHelper.js`（僅 `generateToken()`，簽發不驗證）。

  ### 對外 API
  - `POST /api/v1/auth/register` → validateMiddleware → 201 直接物件 `{ id, email }`（無包裝）
  - `POST /api/v1/auth/login`    → 不驗格式 → 200 直接物件 `{ id, email, token }`（無包裝）
  （對外經 gateway，可能 rewrite 路徑；`/api/v1/` 為服務內部實際路徑）

  ### 錯誤碼（Service 拋語意錯誤，Controller 以 ERROR_MAP 轉 HTTP status）
  | 錯誤碼 | HTTP | 含義 |
  |---|---|---|
  | EMAIL_ALREADY_EXISTS | 409 | 註冊時 email 已存在 |
  | UNKNOWN_USER | 400 | 登入時 email 不存在 |
  | EMAIL_OR_PASSWORD_NOTMATCH | 400 | 登入時密碼錯誤 |
  | （未命中 ERROR_MAP，如 UNKNOWN_SERVER_ERROR） | 500 | 非預期錯誤 |
  錯誤回應 body 為 `{ error, message }`（`error` 為語意錯誤碼字串，未命中時固定 `INTERNAL_SERVER_ERROR`）。
  註：驗證失敗（email 格式 / 密碼 < 6）由 validateMiddleware 直接回 400，訊息籠統為
  「EMAIL或密碼格式不正確」，body 仍是舊版 `{status:"error",message}` 包裝（尚未隨其他路徑改成 `{error,message}`），
  也**沒有**結構化錯誤碼（無 INVALID_EMAIL / MISSING_REQUIRED_FIELDS）。

  ### 密碼與 JWT
  - bcrypt saltRounds=10；明文密碼從不落地、不出現在回應。
  - JWT 由 `jwtHelper.generateToken()` 用 `JWT_SECRET` 簽，payload 僅 `{ id }`，效期 7 天。
  - 此 `JWT_SECRET` 必須與 api-gateway 的 `.env` 一致（gateway 負責驗 JWT）。

  ### 環境變數
  - `JWT_SECRET`（必須與 gateway 一致）
  - `GATEWAY_URL`（預設 http://localhost:8000）——`userRepository.js` 經此打 gateway 的 `/internal/users`，不直連 user-service
  - `PORT`（預設 3000）
  - `CORS_ORIGIN`（預設 http://localhost:8000）

  ### 架構原則（平台層級）
  - 前端一律打 gateway，不直接調用後端；服務間通訊（本服務→user-service）也一律經 gateway 的 `/internal/*` 轉發，不直連。
  - JWT 驗證集中在 gateway；後端服務信任 gateway 注入的 header，本身不驗 JWT
    （auth-service 例外：它負責「簽發」，但不「驗證」）。
  - 三層架構：Controller（HTTP）→ Service（業務）→ Repository（存取）。
  - 錯誤碼語義化：Service 拋語意錯誤，Controller 以 ERROR_MAP 查表映射 HTTP status（OCP：新增錯誤碼免改 controller 邏輯）。

  ### 已清除的遺留代碼（歷史記錄，非現況——見 mistake.md／執行日誌）
  change `simplify-auth-service` 已移除：`middlewares/authMiddleware.js`（未掛載）、
  `jwtHelper.verifyToken()`（無呼叫）、`authController.me()`（未掛路由）、`users.json`（死檔）；
  也解除了 validateMiddleware 同時服務 register/login 的耦合（login 已不驗格式）；
  repository 已由 `userApiClient.js` 改名為 `userRepository.js`；PORT/CORS_ORIGIN 已外部化到 env。

  ### 測試現況（實跑 npx jest 驗證）
  - `authController.test.js`：7 個測試通過。
  - `authService.test.js`：7 個測試通過（mock 路徑已對上改名後的 `userRepository.js`）。
  - 合計 2 suites / 14 tests 全通過。`userRepository.js` 本身無單元測試（學習階段刻意不補）。

  ### 協作約定
  - 學習導向，優先解釋原理與設計思考。
  - `.env` 與 `.env.example` 應同步；跨服務祕鑰（JWT_SECRET）必須一致。
  - 本服務是獨立 git repo（非 monorepo），remote 為 github.com/kuoliwei/auth-service。

# Per-artifact rules
rules:
  proposal:
    - 中文撰寫，200-500 字為宜
    - 包含「為什麼做」(Why)、「變更清單」(What Changes)、「影響範圍」(Impact)
    - 若動到 API/錯誤碼/環境變數，清楚列舉新增或移除項
    - 修改既有行為要說明向後相容性
  specs:
    - 使用 Given/When/Then scenario 格式，每個 Requirement 至少一個 Scenario
    - RFC 2119 關鍵字（MUST/SHALL/SHOULD/MAY）標示需求強度
    - API 變更要有完整 Request/Response JSON 例子
    - 錯誤處理列舉所有 error code 與對應 HTTP status
    - Delta Spec 格式分 ADDED / MODIFIED / REMOVED 三節
  design:
    - 架構決策與權衡說明；服務間通信畫文本流程或時序
    - 明確標示「當前」與「優化後」的差異（架構圖前後對照）
  tasks:
    - 每個任務控制在 2-3 小時內可完成
    - 層級清楚（子任務縮排），標示依賴關係
    - 檢查項包含單元測試與文件更新
